name: ci-versioning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q core ui report app.py

  release:
    name: Bump version, tag and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next semver
        id: ver
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$LAST_TAG" ]; then
            MAJOR=0; MINOR=1; PATCH=0; BUMP=initial
          else
            CUR="${LAST_TAG#v}"
            MAJOR="${CUR%%.*}"
            REST="${CUR#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            MSGS="$(git log --pretty='%s%n%b' "$LAST_TAG..HEAD")"
            if printf '%s\n' "$MSGS" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0; BUMP=major
            elif printf '%s\n' "$MSGS" | grep -qE '^feat(\([^)]*\))?:'; then
              MINOR=$((MINOR+1)); PATCH=0; BUMP=minor
            else
              PATCH=$((PATCH+1)); BUMP=patch
            fi
          fi
          NEXT="v$MAJOR.$MINOR.$PATCH"
          while git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; do
            PATCH=$((PATCH+1))
            NEXT="v$MAJOR.$MINOR.$PATCH"
          done
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
      - name: Update VERSION file
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.ver.outputs.tag }}" | sed 's/^v//' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.ver.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Create annotated tag
        run: |
          set -euo pipefail
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }} (${{ steps.ver.outputs.bump }})"
          git push origin "${{ steps.ver.outputs.tag }}"
      - name: Create GitHub release
        run: |
          set -euo pipefail
          LAST="${{ steps.ver.outputs.last_tag }}"
          if [ -n "$LAST" ]; then
            gh release create "${{ steps.ver.outputs.tag }}" --title "${{ steps.ver.outputs.tag }}" --generate-notes --notes-start-tag "$LAST"
          else
            gh release create "${{ steps.ver.outputs.tag }}" --title "${{ steps.ver.outputs.tag }}" --generate-notes
          fi
      - name: Job summary
        run: |
          echo "Released ${{ steps.ver.outputs.tag }} (bump: ${{ steps.ver.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
